name: addon-bot

# A tag botvX.Y.Z.R on main builds the subscribers' bot with the admin's screens as an addon
# of protocol 2 (cmd/mikan-telegram), apart from the panel's release: the image
# ghcr.io/<owner>/mikan-bot, amd64 and arm64, pushed under its version. The digest is in the
# run's summary.
#
# The source file a panel reads (mikan-addon.json and its signature, made by
# `mikan-release addon` with the release key) is NOT made here: a panel reads the latest
# release of a repository, and in this one "latest" is the panel's own (install.sh and the
# updaters read its manifest). It is published on a repository of its own, by the holder of
# the release key, with this run's digest. So the signing key reaches no job of this workflow.
#
# The code that runs is the code of main: a tag on any other commit stops at the first job
# (guard).
on:
  push:
    tags: ["botv*"]

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tagged commit is on main
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^botv[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid bot version: $GITHUB_REF_NAME"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is on a commit that is not on main"
            exit 1
          fi

  image:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mikan-bot" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#botv}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.bot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
          build-args: VERSION=${{ steps.name.outputs.version }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
      - name: the digest
        run: |
          {
            echo "### mikan-bot ${{ steps.name.outputs.version }}"
            echo
            echo "- image: \`${{ steps.name.outputs.image }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
